name: Deploy to Production (Docker Hub)

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and Push Gateway Image
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/interview-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Voice Service Image
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          file: apps/voice-service/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/interview-voice:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Worker Image
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/interview-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
