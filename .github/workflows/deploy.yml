name: Deploy to Production (Docker Hub)

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: "${{ secrets.DOCKERHUB_USERNAME != '' }}"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Gateway Image
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/interview-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Voice Service Image
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          file: apps/voice-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/interview-voice:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Worker Image
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/interview-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
